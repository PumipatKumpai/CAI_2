    // Initialize State from localStorage
    function initLocalStorage() {
      const savedStudents = localStorage.getItem('voc_students_db');
      if (savedStudents) {
        try { state.students = JSON.parse(savedStudents); } catch(e) { state.students = []; }
      } else {
        state.students = [];
      }

      const currentStudentId = localStorage.getItem('voc_current_student_id');
      if (currentStudentId) {
        const found = state.students.find(s => s.id === currentStudentId);
        if (found) {
          state.currentStudent = found;
          state.viewMode = 'classroom';
        }
      }
    }

    function saveStudentsToStorage() {
      localStorage.setItem('voc_students_db', JSON.stringify(state.students));
    }

    // --- 3. CORE ACTION HANDLERS ---
    
    function handleRegisterOrLogin(e) {
      e.preventDefault();
      const idInput = document.getElementById('reg-id').value.trim();
      const nameInput = document.getElementById('reg-name').value.trim();
      const classInput = document.getElementById('reg-class').value.trim();

      if (!idInput || !nameInput || !classInput) {
        showToast("กรุณากรอกข้อมูลให้ครบทุกช่อง", "error");
        return;
      }

      let student = state.students.find(s => s.id === idInput);
      const nowStr = new Date().toLocaleString('th-TH');

      if (student) {
        student.name = nameInput;
        student.classBranch = classInput;
        student.lastActive = nowStr;
      } else {
        student = {
          id: idInput,
          name: nameInput,
          classBranch: classInput,
          preTestScore: 0,
          postTestScore: 0,
          progress: 0,
          status: 'ยังไม่เรียน',
          registeredAt: nowStr,
          lastActive: nowStr,
          certId: `CERT-VOC-2026-${idInput}`
        };
        state.students.push(student);
      }

      saveStudentsToStorage();
      state.currentStudent = student;
      localStorage.setItem('voc_current_student_id', student.id);
      state.viewMode = 'classroom';
      renderApp();
      showToast(`ยินดีต้อนรับ ${nameInput}`, "success");
    }

    function handleLogoutStudent() {
      localStorage.removeItem('voc_current_student_id');
      state.currentStudent = null;
      state.viewMode = 'registration';
      renderApp();
      showToast("ออกจากระบบเรียบร้อยแล้ว", "info");
    }

    function handlePreTestSelect(questionId, optionIdx) {
      state.preTestAnswers[questionId] = optionIdx;
      renderApp();
    }

    function handleSubmitPreTest() {
      let score = 0;
      ASSESSMENT_QUESTIONS.forEach(q => {
        if (state.preTestAnswers[q.id] === q.answer) score++;
      });

      state.preTestSubmitted = true;
      if (state.currentStudent) {
        state.currentStudent.preTestScore = score;
        state.currentStudent.progress = Math.max(state.currentStudent.progress, 25);
        state.currentStudent.status = state.currentStudent.progress >= 100 ? 'เรียนจบ' : 'กำลังเรียน';
        state.currentStudent.lastActive = new Date().toLocaleString('th-TH');
        saveStudentsToStorage();
      }
      renderApp();
    }

    function handlePostTestSelect(questionId, optionIdx) {
      state.postTestAnswers[questionId] = optionIdx;
      renderApp();
    }

    function handleSubmitPostTest() {
      let score = 0;
      ASSESSMENT_QUESTIONS.forEach(q => {
        if (state.postTestAnswers[q.id] === q.answer) score++;
      });

      state.postTestSubmitted = true;
      if (state.currentStudent) {
        state.currentStudent.postTestScore = Math.max(state.currentStudent.postTestScore, score);
        const isPassed = state.currentStudent.postTestScore >= 7;
        state.currentStudent.progress = isPassed ? 100 : Math.max(state.currentStudent.progress, 75);
        state.currentStudent.status = state.currentStudent.progress === 100 ? 'เรียนจบ' : 'กำลังเรียน';
        state.currentStudent.lastActive = new Date().toLocaleString('th-TH');
        saveStudentsToStorage();
      }
      renderApp();
    }

    function handleMatchClick(type, itemObj) {
      if (!state.selectedItem) {
        state.selectedItem = { type, itemObj };
      } else {
        if (state.selectedItem.type !== type) {
          const item = type === 'item' ? itemObj : state.selectedItem.itemObj;
          const pair = type === 'pair' ? itemObj : state.selectedItem.itemObj;

          if (item.pair === pair.pair) {
            state.matchedPairs.push(item.id);
            showToast("จับคู่ถูกต้อง!", "success");
          } else {
            showToast("ยังไมถูกต้อง ลองใหม่อีกครั้ง", "error");
          }
        }
        state.selectedItem = null;
      }
      renderApp();
    }

    function handleAdminLogin(e) {
      e.preventDefault();
      const pwd = document.getElementById('admin-pwd-input').value;
      if (pwd === '1234') {
        state.isAdminAuth = true;
        renderApp();
        showToast("เข้าสู่ระบบผู้ดูแลเรียบร้อยแล้ว", "success");
      } else {
        showToast("รหัสผ่านผู้ดูแลระบบไม่ถูกต้อง (ใช้ 1234)", "error");

    }

    }

    function handleDeleteStudent(studentId) {
      if (confirm(`คุณต้องการลบข้อมูลนักศึกษารหัส ${studentId} หรือไม่?`)) {
        state.students = state.students.filter(s => s.id !== studentId);
        if (state.currentStudent?.id === studentId) {
          handleLogoutStudent();
        } else {
          saveStudentsToStorage();
          renderApp();
        }
        showToast("ลบข้อมูลนักศึกษาเรียบร้อยแล้ว", "success");
      }
    }

    function handleExportCsv() {
      const activeList = state.useMockData ? MOCK_STUDENTS_SAMPLE : state.students;
      if (activeList.length === 0) {
        showToast("ยังไม่มีข้อมูลนักศึกษาในระบบสำหรับ Export", "error");
        return;
      }

      const headers = ['รหัสประจำตัว', 'ชื่อ-นามสกุล', 'ระดับชั้นและสาขาวิชา', 'ก่อนเรียน(10)', 'หลังเรียน(10)', 'ความก้าวหน้า', 'สถานะ', 'วันที่สมัคร', 'เข้าใช้งานล่าสุด', 'รหัสวุฒิบัตร'];
      const rows = activeList.map(s => [
        `"${s.id}"`,
        `"${s.name}"`,
        `"${s.classBranch}"`,
        s.preTestScore || 0,
        s.postTestScore || 0,
        `"${s.progress || 0}%"`,
        `"${s.status || 'ยังไม่เรียน'}"`,
        `"${s.registeredAt || ''}"`,
        `"${s.lastActive || ''}"`,
        `"${s.certId || ''}"`
      ]);

      // Add UTF-8 BOM \uFEFF for Thai character compatibility in MS Excel
      const csvContent = '\uFEFF' + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.setAttribute('href', url);
      link.setAttribute('download', `รายงานผลการเรียน_ปวช_คอมพิวเตอร์_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast("ดาวน์โหลดรายงาน CSV (Excel UTF-8) สำเร็จ", "success");
    }

    function showToast(msg, type = "info") {
      const existing = document.getElementById('toast-msg');

      const toast = document.createElement('div');
      toast.id = 'toast-msg';
      const bgColor = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-indigo-900';
      toast.className = `fixed bottom-5 right-5 z-50 ${bgColor} text-white text-xs font-bold px-4 py-3 rounded-2xl shadow-xl flex items-center space-x-2 transition-all animate-bounce`;
      toast.innerHTML = `<i class="fa-solid fa-circle-info"></i> <span>${msg}</span>`;
      document.body.appendChild(toast);

      setTimeout(() => toast.remove(), 3000);
    }

                <button onclick="handleSubmitPostTest()" ${Object.keys(state.postTestAnswers).length < ASSESSMENT_QUESTIONS.length ? 'disabled' : ''} class="w-full py-4 rounded-2xl font-bold text-sm shadow-lg transition ${Object.keys(state.postTestAnswers).length === ASSESSMENT_QUESTIONS.length ? 'bg-emerald-600 hover:bg-emerald-500 text-white cursor-pointer' : 'bg-slate-300 text-slate-500 cursor-not-allowed'}">

            ` : `
              <div class="space-y-6">

                          <span class="font-bold text-indigo-900">คำอธิบายเหตุผล: </span>${q.explanation}

    function renderAdminView() {
      if (!state.isAdminAuth) {
        return `
          <div class="max-w-md mx-auto bg-white rounded-3xl border border-slate-200 shadow-xl p-6 md:p-8 space-y-6 text-center">
            <div class="w-16 h-16 bg-amber-100 text-amber-700 rounded-2xl flex items-center justify-center mx-auto shadow-inner text-2xl font-bold">

            </div>

              <button type="submit" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-indigo-950 font-bold text-sm rounded-xl shadow-md transition cursor-pointer">
                ยืนยันรหัสผ่าน
              </button>
            </form>
          </div>
        `;
      }

      const activeList = state.useMockData ? MOCK_STUDENTS_SAMPLE : state.students;
      const filteredList = activeList.filter(s => 
        s.name.includes(state.adminSearchQuery) || 
        s.id.includes(state.adminSearchQuery) || 
        s.classBranch.includes(state.adminSearchQuery)
      );

      const completedCount = activeList.filter(s => s.status === 'เรียนจบ').length;
      const avgPre = activeList.length > 0 ? (activeList.reduce((acc, s) => acc + (s.preTestScore || 0), 0) / activeList.length).toFixed(1) : 0;
      const avgPost = activeList.length > 0 ? (activeList.reduce((acc, s) => acc + (s.postTestScore || 0), 0) / activeList.length).toFixed(1) : 0;

      return `
        <div class="space-y-6">
          <div class="bg-brand-950 text-white p-6 md:p-8 rounded-3xl shadow-xl flex flex-col md:flex-row md:items-center justify-between gap-4 border border-indigo-900">
            <div>
              <span class="bg-amber-400 text-indigo-950 text-xs font-bold px-3 py-1 rounded-full uppercase">
                Teacher Administration Panel
              </span>
              <h2 class="text-2xl font-bold mt-2">แผงควบคุมติดตามผลการเรียนและการประเมินผล</h2>
              <p class="text-xs text-indigo-200 mt-1">วิชา: คอมพิวเตอร์และสารสนเทศเพื่องานอาชีพ (ระดับ ปวช.)</p>
            </div>

            <div class="flex flex-wrap items-center gap-2">
              <button onclick="toggleMockData()" class="px-4 py-2.5 bg-indigo-800 hover:bg-indigo-700 text-indigo-100 font-semibold text-xs rounded-xl transition border border-indigo-600 flex items-center space-x-1.5 cursor-pointer">
                <i class="fa-solid fa-toggle-${state.useMockData ? 'on text-emerald-400' : 'off text-slate-400'} text-base"></i>
                <span>${state.useMockData ? 'ข้อมูลจำลอง (Mock On)' : 'ข้อมูลจริง (Real Data)'}</span>
              </button>

              <button onclick="handleExportCsv()" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl shadow-md transition flex items-center space-x-2 cursor-pointer">
                <i class="fa-solid fa-file-excel text-sm"></i>
                <span>Export UTF-8 (CSV/Excel)</span>
              </button>
            </div>
          </div>

          <!-- Metrics Summary Cards -->
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center space-x-4">
              <div class="p-3.5 bg-indigo-50 text-indigo-600 rounded-xl text-xl"><i class="fa-solid fa-users"></i></div>
              <div>
                <p class="text-xs text-slate-500 font-semibold">นักศึกษาในระบบทั้งหมด</p>
                <h4 class="text-2xl font-bold text-slate-900">${activeList.length} คน</h4>
              </div>
            </div>

            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center space-x-4">
              <div class="p-3.5 bg-emerald-50 text-emerald-600 rounded-xl text-xl"><i class="fa-solid fa-circle-check"></i></div>
              <div>
                <p class="text-xs text-slate-500 font-semibold">อัตราการเรียนจบ</p>
                <h4 class="text-2xl font-bold text-slate-900">${activeList.length > 0 ? Math.round((completedCount / activeList.length) * 100) : 0}%</h4>
              </div>
            </div>

            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center space-x-4">
              <div class="p-3.5 bg-amber-50 text-amber-600 rounded-xl text-xl"><i class="fa-solid fa-chart-column"></i></div>
              <div>
                <p class="text-xs text-slate-500 font-semibold">เฉลี่ย ก่อน - หลังเรียน</p>
                <h4 class="text-2xl font-bold text-slate-900">${avgPre} ➔ ${avgPost}</h4>
              </div>
            </div>

            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center space-x-4">
              <div class="p-3.5 bg-teal-50 text-teal-600 rounded-xl text-xl"><i class="fa-solid fa-award"></i></div>
              <div>
                <p class="text-xs text-slate-500 font-semibold">ใบวุฒิบัตรที่อนุมัติแล้ว</p>
                <h4 class="text-2xl font-bold text-slate-900">${activeList.filter(s => (s.postTestScore || 0) >= 7).length} ใบ</h4>
              </div>
            </div>
          </div>

          <!-- Roster Data Table -->
          <div class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden p-6 space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div>
                <h3 class="font-bold text-slate-900 text-lg">ตารางจัดการผลการเรียนและบันทึกประวัตินักศึกษา</h3>
                <p class="text-xs text-slate-500">บันทึกความก้าวหน้าเรียลไทม์ผ่านระบบ LocalStorage</p>
              </div>

              <div class="relative w-full sm:w-64">
                <input type="text" value="${state.adminSearchQuery}" oninput="state.adminSearchQuery = this.value; renderApp();" placeholder="ค้นหาชื่อ, รหัส, สาขาวิชา..." class="w-full pl-9 pr-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
              </div>
            </div>

            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs border-collapse">
                <thead>
                  <tr class="bg-slate-100 text-slate-700 font-bold border-b border-slate-200">
                    <th class="p-3">รหัสประจำตัว</th>
                    <th class="p-3">ชื่อ - นามสกุล</th>
                    <th class="p-3">ระดับชั้นและสาขาวิชา (พิมพ์ระบุ)</th>
                    <th class="p-3 text-center">ก่อนเรียน (10)</th>
                    <th class="p-3 text-center">หลังเรียน (10)</th>
                    <th class="p-3 text-center">ความก้าวหน้า</th>
                    <th class="p-3 text-center">สถานะ</th>
                    <th class="p-3 text-center">การจัดการ</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${filteredList.length === 0 ? `
                    <tr>
                      <td colSpan="8" class="p-8 text-center text-slate-400">
                        ยังไม่มีข้อมูลนักศึกษาในระบบ หรือไม่พบข้อมูลตามคำค้นหา
                      </td>
                    </tr>
                  ` : filteredList.map(std => `
                    <tr class="hover:bg-slate-50 transition">
                      <td class="p-3 font-semibold text-slate-900">${std.id}</td>
                      <td class="p-3 font-medium text-slate-800">${std.name}</td>
                      <td class="p-3 text-slate-600 font-semibold">${std.classBranch}</td>
                      <td class="p-3 text-center font-bold text-slate-700">${std.preTestScore || 0}/10</td>
                      <td class="p-3 text-center font-bold text-emerald-600">${std.postTestScore || 0}/10</td>
                      <td class="p-3 text-center">
                        <div class="w-20 bg-slate-200 rounded-full h-2 mx-auto overflow-hidden">
                          <div class="bg-indigo-600 h-2 rounded-full" style="width: ${std.progress || 0}%"></div>
                        </div>
                        <span class="text-[10px] text-slate-500 font-bold mt-0.5 block">${std.progress || 0}%</span>
                      </td>
                      <td class="p-3 text-center">
                        <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold ${std.status === 'เรียนจบ' ? 'bg-emerald-100 text-emerald-800' : std.status === 'กำลังเรียน' ? 'bg-amber-100 text-amber-800' : 'bg-slate-100 text-slate-600'}">
                          ${std.status || 'ยังไม่เรียน'}
                        </span>
                      </td>
                      <td class="p-3 text-center space-x-1">
                        <button onclick="openStudentDetailModal('${std.id}')" class="p-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-lg text-xs transition" title="ดูรายละเอียด">
                          <i class="fa-solid fa-eye"></i>
                        </button>
                        ${!state.useMockData ? `
                          <button onclick="handleDeleteStudent('${std.id}')" class="p-1.5 bg-rose-50 hover:bg-rose-100 text-rose-700 rounded-lg text-xs transition" title="ลบนักศึกษา">
                            <i class="fa-solid fa-trash-can"></i>
                          </button>
                        ` : ''}
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    // --- 5. MODAL HELPERS ---

    function openHelpModal() {
      const modal = document.getElementById('modal-container');
      modal.innerHTML = `
        <div class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
          <div class="bg-white max-w-lg w-full rounded-3xl p-6 md:p-8 space-y-4 shadow-2xl relative border border-slate-100">
            <button onclick="closeModal()" class="absolute right-5 top-5 text-slate-400 hover:text-slate-600">
              <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <div class="flex items-center space-x-2 text-indigo-950 font-bold text-base">
              <i class="fa-solid fa-circle-question text-indigo-600"></i>
              <span>คู่มือการเรียนรู้บทเรียนออนไลน์ (ระดับ ปวช.)</span>
            </div>
            <div class="space-y-3 text-xs text-slate-600 leading-relaxed border-y border-slate-100 py-4">
              <p>1. <strong>ลงทะเบียน</strong>: กรอกรหัสประจำตัว ชื่อ-นามสกุล และพิมพ์ระบุระดับชั้น/สาขาวิชาได้อย่างอิสระ</p>
              <p>2. <strong>ทำแบบทดสอบก่อนเรียน</strong>: ทำแบบทดสอบก่อนเรียน 10 ข้อ เพื่อบันทึกคะแนนตั้งต้น</p>
              <p>3. <strong>ศึกษาเนื้อหา</strong>: เรียนรู้บทเรียนที่มีโครงสร้างชัดเจน และแผนผัง SVG Infographic สรุปสาระสำคัญ</p>
              <p>4. <strong>ฝึกทักษะปฏิสัมพันธ์</strong>: ทำกิจกรรมจับคู่ทบทวนความรู้และตอบคำถามระหว่างเรียน</p>
              <p>5. <strong>ทำแบบทดสอบหลังเรียน</strong>: หากสอบได้คะแนนผ่าน 70% (7/10) ขึ้นไป จะสามารถรับและพิมพ์ใบวุฒิบัตรได้ทันที</p>
            </div>
            <button onclick="closeModal()" class="w-full py-3 bg-indigo-600 text-white text-xs font-bold rounded-xl hover:bg-indigo-500 transition cursor-pointer">
              เข้าใจแล้ว เริ่มต้นเรียนรู้
            </button>
          </div>
        </div>
      `;
    }

    function openCertModal() {
      const student = state.currentStudent;
      if (!student) return;

      const modal = document.getElementById('modal-container');
      modal.innerHTML = `
        <div class="fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-4 overflow-y-auto">
          <div id="printable-certificate" class="bg-white max-w-2xl w-full rounded-3xl p-8 space-y-6 shadow-2xl border-8 border-amber-400 relative text-center">
            <button onclick="closeModal()" class="absolute right-4 top-4 text-slate-400 hover:text-slate-600 no-print">
              <i class="fa-solid fa-xmark text-lg"></i>
            </button>

            <div class="space-y-2">
              <div class="w-16 h-16 bg-amber-400 text-indigo-950 rounded-full flex items-center justify-center mx-auto shadow-md text-2xl font-bold">
                <i class="fa-solid fa-award"></i>
              </div>
              <p class="text-[11px] font-extrabold text-amber-600 tracking-widest uppercase">
                VOCATIONAL E-LEARNING CERTIFICATE OF ACHIEVEMENT
              </p>
              <h2 class="text-2xl font-extrabold text-indigo-950">ใบประกาศนียบัตรวุฒิบัตรการศึกษา</h2>
            </div>

            <div class="space-y-3 border-y border-slate-200 py-6">
              <p class="text-xs text-slate-500">ขอมอบใบประกาศนียบัตรฉบับนี้เพื่อแสดงว่า</p>
              <h3 class="text-2xl font-bold text-slate-900">${student.name}</h3>
              <p class="text-xs text-slate-600">
                ระดับชั้น/สาขาวิชา: <span class="font-bold text-indigo-900">${student.classBranch}</span> | รหัสประจำตัว: <span class="font-bold">${student.id}</span>
              </p>
              <p class="text-xs text-slate-600 mt-2">ได้ผ่านการศึกษาและสอบประเมินผลสัมฤทธิ์ตามหลักสูตรบทเรียนออนไลน์</p>
              <p class="text-base font-extrabold text-indigo-950">"วิชาคอมพิวเตอร์และสารสนเทศเพื่องานอาชีพ"</p>
              <p class="text-xs text-emerald-700 font-bold">
                ผลการทดสอบหลังเรียน: ${student.postTestScore} / 10 คะแนน (ผ่านเกณฑ์มาตรฐาน 70%)
              </p>
            </div>

            <div class="flex items-center justify-between text-[11px] text-slate-500 px-4 pt-2">
              <div class="text-left">
                <p>รหัสวุฒิบัตร: <span class="font-mono font-bold text-slate-700">${student.certId}</span></p>
                <p>วันที่ออกเอกสาร: ${new Date().toLocaleDateString('th-TH')}</p>
              </div>

              <button onclick="window.print()" class="px-5 py-2.5 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-500 transition flex items-center space-x-1.5 shadow-md no-print text-xs">
                <i class="fa-solid fa-print"></i>
                <span>พิมพ์ใบวุฒิบัตร</span>
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function openStudentDetailModal(stdId) {
      const activeList = state.useMockData ? MOCK_STUDENTS_SAMPLE : state.students;
      const std = activeList.find(s => s.id === stdId);
      if (!std) return;

      const modal = document.getElementById('modal-container');
      modal.innerHTML = `
        <div class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
          <div class="bg-white max-w-lg w-full rounded-3xl p-6 space-y-4 shadow-2xl relative">
            <button onclick="closeModal()" class="absolute right-5 top-5 text-slate-400 hover:text-slate-600">
              <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <h3 class="font-bold text-lg text-slate-900 border-b border-slate-100 pb-2 flex items-center gap-2">
              <i class="fa-solid fa-file-invoice text-indigo-600"></i>
              <span>รายงานผลการเรียนนักศึกษารายบุคคล</span>
            </h3>
            <div class="space-y-3 text-xs">
              <div class="flex justify-between border-b pb-1.5">
                <span class="text-slate-500">ชื่อ - นามสกุล:</span>
                <span class="font-bold text-slate-900">${std.name}</span>
              </div>
              <div class="flex justify-between border-b pb-1.5">
                <span class="text-slate-500">รหัสประจำตัว:</span>
                <span class="font-bold text-slate-900">${std.id}</span>
              </div>
              <div class="flex justify-between border-b pb-1.5">
                <span class="text-slate-500">ระดับชั้นและสาขาวิชา:</span>
                <span class="font-bold text-indigo-900">${std.classBranch}</span>
              </div>
              <div class="flex justify-between border-b pb-1.5">
                <span class="text-slate-500">คะแนนก่อนเรียน:</span>
                <span class="font-bold text-slate-700">${std.preTestScore || 0} / 10 คะแนน</span>
              </div>
              <div class="flex justify-between border-b pb-1.5">
                <span class="text-slate-500">คะแนนหลังเรียน:</span>
                <span class="font-bold text-emerald-600">${std.postTestScore || 0} / 10 คะแนน</span>
              </div>
              <div class="flex justify-between border-b pb-1.5">
                <span class="text-slate-500">ความก้าวหน้าการเรียน:</span>
                <span class="font-bold text-indigo-600">${std.progress || 0}%</span>
              </div>
              <div class="flex justify-between border-b pb-1.5">
                <span class="text-slate-500">รหัสวุฒิบัตร:</span>
                <span class="font-mono font-bold text-slate-700">${std.certId || '-'}</span>
              </div>
            </div>
            <button onclick="closeModal()" class="w-full py-2.5 bg-slate-800 text-white text-xs font-bold rounded-xl hover:bg-slate-700 transition cursor-pointer">
              ปิดหน้าต่าง
            </button>
          </div>
        </div>
      `;
    }

    function closeModal() {
      document.getElementById('modal-container').innerHTML = '';
    }

    // --- 6. MAIN RENDER APP FUNCTION ---
    function renderApp() {
      renderHeader();
      const main = document.getElementById('main-content');
      
      if (state.viewMode === 'registration') {
        main.innerHTML = renderRegistrationView();
      } else if (state.viewMode === 'classroom') {
        main.innerHTML = renderClassroomView();
      } else if (state.viewMode === 'admin') {
        main.innerHTML = renderAdminView();
      }
    }

    // Initial Window Onload Event
    window.onload = function() {
      initLocalStorage();
      renderApp();
    };
  </script>
</body>
</html>
