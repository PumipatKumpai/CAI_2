1. **หน่วยรับข้อมูล (Input Unit)**: อุปกรณ์ที่ทำหน้าที่รับข้อมูลหรือคำสั่งจากผู้ใช้เข้าสู่ระบบ เช่น คีย์บอร์ด, เมาส์, เครื่องสแกนบาร์โค้ดในงานคลังสินค้า, และเซนเซอร์ (Sensors) ตรวจจับอุณหภูมิ/ความดันในโรงงานอุตสาหกรรม
2. **หน่วยประมวลผลกลาง (CPU - Central Processing Unit)**: เปรียบเสมือนสมองของคอมพิวเตอร์ ทำหน้าที่คำนวณตรรกะ (ALU) และควบคุมการทำงาน (CU) ความเร็วของ CPU วัดเป็น Gigahertz (GHz)
3. **หน่วยความจำ (Memory Unit)**:
   - **RAM (Random Access Memory)**: หน่วยความจำหลักแบบชั่วคราว มีผลโดยตรงต่อความลื่นไหลในการเปิดโปรแกรมพร้อมกัน (แนะนำ 16GB ขึ้นไปสำหรับงานช่าง/ออกแบบ)
   - **ROM (Read Only Memory)**: บันทึกคำสั่งเริ่มต้นระบบ (BIOS/UEFI) มาจากโรงงาน
4. **หน่วยแสดงผล (Output Unit)**: แสดงผลลัพธ์ผ่าน จอภาพ (Monitor), เครื่องพิมพ์รายงาน (Printer), หรือสัญญาณสั่งการแขนกลอัตโนมัติ (Robotics Control)`

   - **LAN (Local Area Network)**: เครือข่ายท้องถิ่นภายในอาคาร/แผนกช่าง เช่น เชื่อมต่อคอมพิวเตอร์กับเครื่องพิมพ์ประจำแผนก

    question: '10. ข้อใดคือลักษณะของ "รหัสผ่านที่ปลอดภัยสูง (Strong Password)" ตามมาตรฐาน?',
    options: [
      'ก. 123456789',
      'ข. birthday2005',
      'ค. Voc#Tech2026!Pass',
      'ง. admin'
    ],
    answer: 2,
    explanation: 'Voc#Tech2026!Pass มีความยาวเกิน 12 ตัวอักษร ผสมตัวอักษรใหญ่ เล็ก ตัวเลข และสัญลักษณ์พิเศษ'
  }
];

// --- MAIN REACT APPLICATION COMPONENT ---
function App() {
  // Auth & Student States
  const [user, setUser] = useState(null);
  const [students, setStudents] = useState([]);
  const [loadingDb, setLoadingDb] = useState(true);

  // Active View State: 'registration' | 'classroom' | 'admin'
  const [viewMode, setViewMode] = useState('registration');
  const [adminPasswordInput, setAdminPasswordInput] = useState('');
  const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);

  // Student Registration Form State (with Free-text Class/Branch input)
  const [studentIdInput, setStudentIdInput] = useState('');
  const [studentNameInput, setStudentNameInput] = useState('');
  const [studentClassInput, setStudentClassInput] = useState(''); // Free text!
  const [currentStudent, setCurrentStudent] = useState(null);

  // Classroom Learning States
  const [activeUnitId, setActiveUnitId] = useState(1);
  const [activeTab, setActiveTab] = useState('pretest'); // 'pretest' | 'lesson' | 'interactive' | 'inlesson' | 'posttest'
  const [activeLessonIndex, setActiveLessonIndex] = useState(0);

  // Assessment Quiz States
  const [preTestAnswers, setPreTestAnswers] = useState({});
  const [preTestSubmitted, setPreTestSubmitted] = useState(false);
  
  const [postTestAnswers, setPostTestAnswers] = useState({});
  const [postTestSubmitted, setPostTestSubmitted] = useState(false);

  // Interactive Matching Game State
  const [matchedPairs, setMatchedPairs] = useState([]);
  const [selectedItem, setSelectedItem] = useState(null);

  // In-Lesson Self Check State
  const [inLessonAnswer, setInLessonAnswer] = useState(null);
  const [inLessonFeedback, setInLessonFeedback] = useState(false);

  // Modals
  const [showAiDrawer, setShowAiDrawer] = useState(false);
  const [showHelpModal, setShowHelpModal] = useState(false);
  const [showCertModal, setShowCertModal] = useState(false);
  const [selectedStudentDetail, setSelectedStudentDetail] = useState(null);

  // AI Assistant Chat State
  const [aiMessages, setAiMessages] = useState([
    { sender: 'ai', text: 'สวัสดีครับนักศึกษา ปวช.! มีข้อสงสัยเกี่ยวกับเนื้อหาคอมพิวเตอร์ ฮาร์ดแวร์ เครือข่าย AI หรือกฎหมายคอมพิวเตอร์/PDPA สอบถามผมได้เลยครับ 🤖' }
  ]);
  const [aiInputText, setAiInputText] = useState('');
  const [aiLoading, setAiLoading] = useState(false);

  // --- 1. LOAD / SAVE DATA WITH LOCAL STORAGE ---
  useEffect(() => {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      setStudents(Array.isArray(saved) ? saved : []);
      const savedStudentId = localStorage.getItem('voc_current_student_id');
      if (savedStudentId) {
        const found = (Array.isArray(saved) ? saved : []).find(s => s.id === savedStudentId);
        if (found) {
          setCurrentStudent(found);
          setViewMode('classroom');
        }
      }
    } catch (err) {
      console.error('อ่านข้อมูลในเครื่องไม่สำเร็จ:', err);
      setStudents([]);
    }
    setLoadingDb(false);
  }, []);

  useEffect(() => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(students));
    } catch (err) {
      console.error('บันทึกข้อมูลในเครื่องไม่สำเร็จ:', err);
      alert('พื้นที่จัดเก็บข้อมูลของเบราว์เซอร์อาจเต็ม กรุณาส่งออกข้อมูลสำรอง');
    }
  }, [students]);

  // Derived Active Unit
  const activeUnit = useMemo(() => {
    return CURRICULUM_UNITS.find(u => u.id === activeUnitId) || CURRICULUM_UNITS[0];
  }, [activeUnitId]);

  // Dynamic Component for SVG Diagram
  const SvgDiagramComponent = activeUnit.svgDiagram;

  // --- 2. STUDENT REGISTRATION & LOGIN HANDLERS ---
  const handleRegisterOrLogin = async (e) => {
    e.preventDefault();
    if (!studentIdInput.trim() || !studentNameInput.trim() || !studentClassInput.trim()) {
      alert("กรุณากรอกข้อมูลให้ครบทุกช่อง (รหัสประจำตัว, ชื่อ-นามสกุล, และระดับชั้น/สาขาวิชา)");
      return;
    }

    const cleanId = studentIdInput.trim();
    const cleanName = studentNameInput.trim();
    const cleanClass = studentClassInput.trim();

    // Check if student already exists in real database
    const existing = students.find(s => s.id === cleanId);
    let studentData = null;

    if (existing) {
      studentData = {
        ...existing,
        name: cleanName,
        classBranch: cleanClass,
        lastActive: new Date().toLocaleString('th-TH')
      };
    } else {
      studentData = {
        id: cleanId,
        name: cleanName,
        classBranch: cleanClass,
        progress: 0,
        preTestScore: 0,
        postTestScore: 0,
        status: 'ยังไม่เรียน',
        registeredAt: new Date().toLocaleString('th-TH'),
        lastActive: new Date().toLocaleString('th-TH'),
        certId: `CERT-VOC-2026-${cleanId}`
      };
    }

    // บันทึกข้อมูลไว้ในเบราว์เซอร์เครื่องนี้
    setStudents(prev => {
      const next = prev.filter(s => s.id !== cleanId);
      return [...next, studentData];
    });

    setCurrentStudent(studentData);
    localStorage.setItem('voc_current_student_id', cleanId);
    setViewMode('classroom');
  };

  const handleLogoutStudent = () => {
    localStorage.removeItem('voc_current_student_id');
    setCurrentStudent(null);
    setViewMode('registration');
  };

  // --- 3. ASSESSMENT QUIZ LOGIC ---
  const handleCalculateScore = (answersMap) => {
    let correct = 0;
    ASSESSMENT_QUESTIONS.forEach(q => {
      if (answersMap[q.id] === q.answer) correct++;
    });
    return correct;
  };

  const handleSubmitPreTest = async () => {
    const score = handleCalculateScore(preTestAnswers);
    setPreTestSubmitted(true);
    
    if (currentStudent) {
      const updatedProgress = Math.max(currentStudent.progress, 25);
      const updatedStatus = updatedProgress >= 100 ? 'เรียนจบ' : 'กำลังเรียน';
      const updatedStudent = {
        ...currentStudent,
        preTestScore: score,
        progress: updatedProgress,
        status: updatedStatus,
        lastActive: new Date().toLocaleString('th-TH')
      };

      setCurrentStudent(updatedStudent);
      setStudents(prev => prev.map(s => s.id === updatedStudent.id ? updatedStudent : s));
    }
  };

  const handleSubmitPostTest = async () => {
    const score = handleCalculateScore(postTestAnswers);
    setPostTestSubmitted(true);

    if (currentStudent) {
      const updatedPostScore = Math.max(currentStudent.postTestScore, score);
      // Completion requires at least 70% post test score (7/10)
      const isPassed = updatedPostScore >= 7;
      const updatedProgress = isPassed ? 100 : Math.max(currentStudent.progress, 75);
      const updatedStatus = updatedProgress === 100 ? 'เรียนจบ' : 'กำลังเรียน';

      const updatedStudent = {
        ...currentStudent,
        postTestScore: updatedPostScore,
        progress: updatedProgress,
        status: updatedStatus,
        lastActive: new Date().toLocaleString('th-TH')
      };

      setCurrentStudent(updatedStudent);
      setStudents(prev => prev.map(s => s.id === updatedStudent.id ? updatedStudent : s));
    }
  };

  // --- 4. INTERACTIVE MATCHING GAME LOGIC ---
  const handleMatchClick = (type, value) => {
    if (!selectedItem) {
      setSelectedItem({ type, value });
    } else {
      if (selectedItem.type !== type) {
        const itemObj = type === 'item' ? value : selectedItem.value;
        const pairObj = type === 'pair' ? value : selectedItem.value;

        if (itemObj.pair === pairObj) {
          setMatchedPairs(prev => [...prev, itemObj.id]);
        }
      }
      setSelectedItem(null);
    }
  };

  // --- 5. ADMIN / TEACHER DASHBOARD LOGIC ---
  const handleAdminLogin = (e) => {
    e.preventDefault();
    if (adminPasswordInput === '1234') {
      setIsAdminAuthenticated(true);
    } else {
      alert("รหัสผ่านผู้ดูแลระบบไม่ถูกต้อง! (รหัสผ่านคือ 1234)");
    }
  };

  const handleDeleteStudent = async (studentId) => {
    if (window.confirm(`คุณต้องการลบข้อมูลนักศึกษารหัส ${studentId} หรือไม่?`)) {
      setStudents(prev => prev.filter(s => s.id !== studentId));
      if (currentStudent?.id === studentId) {
        handleLogoutStudent();
      }
    }
  };

  // Export CSV with UTF-8 BOM for Microsoft Excel Compatibility
  const handleExportCsv = () => {
    if (students.length === 0) {
      alert("ยังไม่มีข้อมูลนักศึกษาในระบบสำหรับ Export");
      return;
    }

    const headers = [
      'รหัสประจำตัวนักศึกษา',
      'ชื่อ-นามสกุล',
      'ระดับชั้นและสาขาวิชา',
      'คะแนนก่อนเรียน (10)',
      'คะแนนหลังเรียน (10)',
      'ความก้าวหน้า (%)',
      'สถานะการเรียน',
      'วันที่สมัครเข้าใช้งาน',
      'การเข้าใช้งานล่าสุด',
      'รหัสวุฒิบัตร'
    ];

    const rows = students.map(s => [
      `"${s.id || ''}"`,
      `"${s.name || ''}"`,
      `"${s.classBranch || ''}"`,
      s.preTestScore || 0,
      s.postTestScore || 0,
      `${s.progress || 0}%`,
      `"${s.status || 'ยังไม่เรียน'}"`,
      `"${s.registeredAt || ''}"`,
      `"${s.lastActive || ''}"`,
      `"${s.certId || ''}"`
    ]);

    // Prepend UTF-8 BOM \uFEFF to force Excel to open with Thai encoding
    const csvContent = '\uFEFF' + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.setAttribute('href', url);
    link.setAttribute('download', `รายงานผลการเรียน_วิชาคอมพิวเตอร์_ปวช_${new Date().toISOString().slice(0,10)}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  };

  // --- 6. GEMINI AI ASSISTANT ---
  const handleSendAiMessage = async () => {
    if (!aiInputText.trim()) return;

    const userMsg = { sender: 'user', text: aiInputText };
    setAiMessages(prev => [...prev, userMsg]);
    const promptText = aiInputText;
    setAiInputText('');
    setAiLoading(true);

    try {
      // โหมดไฟล์เดียวไม่มีบริการ AI ภายนอก จึงใช้คำตอบแนะนำพื้นฐานด้านล่าง
      
      const replyText = `คำถามของคุณเกี่ยวกับ "${promptText}"\n\nคำแนะนำ: ลองทบทวนเนื้อหาในบทเรียนที่เกี่ยวข้อง แล้วพิจารณาหลักการสำคัญและตัวอย่างการนำไปใช้ในงานอาชีพ หากต้องการคำตอบจาก AI จริง จำเป็นต้องเชื่อมต่อบริการ AI ผ่านระบบหลังบ้านเพิ่มเติม`;
      setAiMessages(prev => [...prev, { sender: 'ai', text: replyText }]);
    } catch (err) {
      setAiMessages(prev => [
        ...prev,
        { sender: 'ai', text: `(ผู้ช่วย AI): สำหรับหัวข้อ "${promptText}" ในสายอาชีพ ปวช. คือการประยุกต์ใช้เทคโนโลยีดิจิทัลอย่างถูกต้อง ปลอดภัย ตาม พ.ร.บ. คอมพิวเตอร์ และเพิ่มประสิทธิภาพงานอาชีพครับ!` }
      ]);
    } finally {
      setAiLoading(false);
    }
  };

  return (
    <div className="min-h-screen bg-slate-50 text-slate-800 font-sans flex flex-col selection:bg-indigo-500 selection:text-white">
      
      {/* TOP NAVIGATION BAR */}
      <header className="bg-indigo-950 text-white shadow-md sticky top-0 z-30 border-b border-indigo-900">
        <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
          
          {/* Subject & Brand Title */}
          <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setViewMode(currentStudent ? 'classroom' : 'registration')}>
            <div className="bg-amber-400 p-2 rounded-xl text-indigo-950 font-bold shadow-md">
              <GraduationCap className="w-6 h-6" />
            </div>
            <div>
              <h1 className="text-base md:text-lg font-bold tracking-tight text-white leading-tight flex items-center gap-2">
                ระบบบทเรียนออนไลน์ e-Learning (ปวช.)
              </h1>
              <p className="text-xs text-indigo-200">
                วิชา: คอมพิวเตอร์และสารสนเทศเพื่องานอาชีพ (รหัสวิชา 20001-2001)
              </p>
            </div>
          </div>

          {/* Action Buttons & Navigation */}
          <div className="flex items-center flex-wrap gap-2">
            
            {/* View Mode Switcher */}

                  viewMode !== 'admin' ? 'bg-indigo-600 text-white shadow' : 'text-indigo-300 hover:text-white'
                }`}
              >
                🎓 ผู้เรียน ปวช.
              </button>
              <button 
                onClick={() => setViewMode('admin')}
                className={`px-3 py-1.5 rounded-lg font-semibold transition ${
                  viewMode === 'admin' ? 'bg-amber-500 text-indigo-950 shadow' : 'text-indigo-300 hover:text-white'
                }`}
              >
                👨‍🏫 ผู้ดูแล / ครูผู้สอน
              </button>
            </div>

            {/* AI Assistant Drawer Trigger */}
            <button
              onClick={() => setShowAiDrawer(true)}
              className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-2 rounded-xl font-medium flex items-center space-x-1.5 transition shadow"
              title="ผู้ช่วย AI ตอบคำถาม"
            >
              <Sparkles className="w-4 h-4 text-amber-300 animate-pulse" />
              <span className="hidden sm:inline">ผู้ช่วย AI</span>
            </button>

            {/* Help Guide Modal */}
            <button
              onClick={() => setShowHelpModal(true)}
              className="bg-indigo-900 hover:bg-indigo-800 text-indigo-200 p-2 rounded-xl border border-indigo-700 transition"
              title="คู่มือการใช้งาน"
            >
              <HelpCircle className="w-4 h-4" />
            </button>

            {/* Logout Button if logged in */}
            {currentStudent && viewMode === 'classroom' && (
              <button
                onClick={handleLogoutStudent}
                className="bg-rose-900/60 hover:bg-rose-800 text-rose-200 text-xs px-2.5 py-2 rounded-xl border border-rose-700/60 transition flex items-center space-x-1"
                title="ออกจากระบบ"
              >
                <LogOut className="w-4 h-4" />
              </button>
            )}
          </div>
        </div>
      </header>

      {/* MAIN CONTENT BODY */}
      <main className="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">

        {/* ================= 1. STUDENT REGISTRATION & LOGIN VIEW ================= */}
        {viewMode === 'registration' && (
          <div className="max-w-2xl mx-auto space-y-6 py-6">
            
            {/* Header Welcome Banner */}
            <div className="bg-gradient-to-br from-indigo-900 via-indigo-800 to-indigo-950 rounded-3xl p-6 md:p-8 text-white shadow-xl text-center space-y-3 relative overflow-hidden border border-indigo-700/50">
              <div className="w-16 h-16 bg-amber-400 text-indigo-950 rounded-2xl flex items-center justify-center mx-auto shadow-lg mb-2">
                <BookOpen className="w-9 h-9" />
              </div>
              <h2 className="text-2xl md:text-3xl font-extrabold tracking-tight">
                เข้าสู่บทเรียนออนไลน์ (ระดับ ปวช.)
              </h2>
              <p className="text-xs md:text-sm text-indigo-200 max-w-md mx-auto leading-relaxed">
                วิชา คอมพิวเตอร์และสารสนเทศเพื่องานอาชีพ • เรียนรู้ด้วยตนเองได้ทุกที่ ทุกเวลา ทุกอุปกรณ์ (Cross-Platform)
              </p>
            </div>

            {/* Registration / Login Card */}
            <div className="bg-white rounded-3xl border border-slate-200 shadow-xl p-6 md:p-8 space-y-6">
              
              <div className="border-b border-slate-100 pb-4">
                <h3 className="text-lg font-bold text-slate-900 flex items-center gap-2">
                  <UserPlus className="w-5 h-5 text-indigo-600" />
                  <span>ลงทะเบียน / เข้าสู่ระบบนักศึกษา</span>
                </h3>
                <p className="text-xs text-slate-500 mt-1">
                  กรอกข้อมูลประจำตัวนักศึกษาเพื่อเริ่มต้นเรียน บันทึกความก้าวหน้า และรับใบวุฒิบัตร
                </p>
              </div>

              <form onSubmit={handleRegisterOrLogin} className="space-y-4">
                
                {/* 1. Student ID */}
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1.5">
                    รหัสประจำตัวนักศึกษา <span className="text-rose-500">*</span>
                  </label>
                  <input
                    type="text"
                    required
                    placeholder="เช่น 6620101001"
                    value={studentIdInput}
                    onChange={(e) => setStudentIdInput(e.target.value)}
                    className="w-full px-4 py-3 text-sm bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition"
                  />
                </div>

                {/* 2. Full Name */}
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1.5">
                    ชื่อ - นามสกุล <span className="text-rose-500">*</span>
                  </label>
                  <input
                    type="text"
                    required
                    placeholder="เช่น นายสมชาย ใจดี"
                    value={studentNameInput}
                    onChange={(e) => setStudentNameInput(e.target.value)}
                    className="w-full px-4 py-3 text-sm bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition"
                  />
                </div>

                {/* 3. Class & Branch (FREE TEXT INPUT as requested) */}
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1.5 flex items-center justify-between">
                    <span>ระดับชั้นและสาขาวิชา (พิมพ์ระบุอิสระ) <span className="text-rose-500">*</span></span>
                    <span className="text-[11px] text-indigo-600 font-normal">พิมพ์ระบุได้ตามจริง</span>
                  </label>
                  <input
                    type="text"
                    required
                    placeholder="เช่น ปวช. 1/2 สาขาเทคโนโลยีสารสนเทศ หรือ ปวช. 2/3 สาขาคอมพิวเตอร์ธุรกิจ"
                    value={studentClassInput}
                    onChange={(e) => setStudentClassInput(e.target.value)}
                    className="w-full px-4 py-3 text-sm bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition"
                  />
                  <p className="text-[11px] text-slate-500 mt-1">
                    💡 ตัวอย่าง: ปวช. 1/1 สาขาช่างไฟฟ้า, ปวช. 2/2 สาขาการบัญชี, ปวช. 3/1 สาขาช่างยนต์
                  </p>
                </div>

                <button
                  type="submit"
                  className="w-full py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-base rounded-2xl shadow-lg shadow-indigo-600/30 transition flex items-center justify-center space-x-2 cursor-pointer mt-2"
                >
                  <span>เข้าสู่ห้องเรียนออนไลน์</span>
                  <ArrowRight className="w-5 h-5" />
                </button>
              </form>

              {/* Roster Quick Pick if student logged in before */}
              {students.length > 0 && (
                <div className="pt-4 border-t border-slate-100">
                  <p className="text-xs font-bold text-slate-500 mb-2">
                    หรือเลือกรายชื่อนักศึกษาที่เคยลงทะเบียนในระบบเรียบร้อยแล้ว:
                  </p>
                  <div className="flex flex-wrap gap-2 max-h-36 overflow-y-auto">
                    {students.map(s => (
                      <button
                        key={s.id}
                        type="button"
                        onClick={() => {

                VOCATIONAL E-LEARNING CERTIFICATE OF ACHIEVEMENT
              </p>
              <h2 className="text-2xl font-extrabold text-indigo-950">
                ใบประกาศนียบัตรวุฒิบัตรการศึกษา
              </h2>
            </div>

            {/* Body Info */}
            <div className="space-y-3 border-y border-slate-200 py-6">
              <p className="text-xs text-slate-500">ขอมอบใบประกาศนียบัตรฉบับนี้เพื่อแสดงว่า</p>
              <h3 className="text-2xl font-bold text-slate-900">{currentStudent.name}</h3>
              <p className="text-xs text-slate-600">
                ระดับชั้น/สาขาวิชา: <span className="font-bold text-indigo-900">{currentStudent.classBranch}</span> | รหัสประจำตัว: <span className="font-bold">{currentStudent.id}</span>
              </p>
              <p className="text-xs text-slate-600 mt-2">
                ได้ผ่านการศึกษาและสอบประเมินผลสัมฤทธิ์ตามหลักสูตรบทเรียนออนไลน์
              </p>
              <p className="text-base font-extrabold text-indigo-950">
                "วิชาคอมพิวเตอร์และสารสนเทศเพื่องานอาชีพ"
              </p>
              <p className="text-xs text-emerald-700 font-bold">
                ผลการทดสอบหลังเรียน: {currentStudent.postTestScore} / 10 คะแนน (ผ่านเกณฑ์มาตรฐาน 70%)
              </p>
            </div>

            {/* Footer Signatures */}
            <div className="flex items-center justify-between text-[11px] text-slate-500 px-4 pt-2">
              <div className="text-left">
                <p>รหัสวุฒิบัตร: <span className="font-mono font-bold text-slate-700">{currentStudent.certId}</span></p>
                <p>วันที่ออกเอกสาร: {new Date().toLocaleDateString('th-TH')}</p>
              </div>

              <button
                onClick={() => window.print()}
                className="px-5 py-2.5 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-500 transition flex items-center space-x-1.5 shadow-md print:hidden cursor-pointer text-xs"
              >
                <Printer className="w-4 h-4" />
                <span>พิมพ์ใบวุฒิบัตร</span>
              </button>
            </div>

          </div>
        </div>
      )}

      {/* 4. STUDENT DETAIL MODAL (ADMIN VIEW) */}
      {selectedStudentDetail && (
        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
          <div className="bg-white max-w-lg w-full rounded-3xl p-6 space-y-4 shadow-2xl relative">
            <button 
              onClick={() => setSelectedStudentDetail(null)}
              className="absolute right-5 top-5 text-slate-400 hover:text-slate-600"
            >
              <X className="w-5 h-5" />
            </button>

            <h3 className="font-bold text-lg text-slate-900 border-b border-slate-100 pb-2 flex items-center gap-2">
              <FileText className="w-5 h-5 text-indigo-600" />
              <span>รายงานผลการเรียนนักศึกษารายบุคคล</span>
            </h3>

            <div className="space-y-3 text-xs">
              <div className="flex justify-between border-b pb-1.5">
                <span className="text-slate-500">ชื่อ - นามสกุล:</span>
                <span className="font-bold text-slate-900">{selectedStudentDetail.name}</span>
              </div>
              <div className="flex justify-between border-b pb-1.5">
                <span className="text-slate-500">รหัสประจำตัว:</span>
                <span className="font-bold text-slate-900">{selectedStudentDetail.id}</span>
              </div>
              <div className="flex justify-between border-b pb-1.5">
                <span className="text-slate-500">ระดับชั้นและสาขาวิชา:</span>
                <span className="font-bold text-indigo-900">{selectedStudentDetail.classBranch}</span>
              </div>
              <div className="flex justify-between border-b pb-1.5">
                <span className="text-slate-500">คะแนนก่อนเรียน:</span>
                <span className="font-bold text-slate-700">{selectedStudentDetail.preTestScore || 0} / 10 คะแนน</span>
              </div>
              <div className="flex justify-between border-b pb-1.5">
                <span className="text-slate-500">คะแนนหลังเรียน:</span>
                <span className="font-bold text-emerald-600">{selectedStudentDetail.postTestScore || 0} / 10 คะแนน</span>
              </div>
              <div className="flex justify-between border-b pb-1.5">
                <span className="text-slate-500">ความก้าวหน้าการเรียน:</span>
                <span className="font-bold text-indigo-600">{selectedStudentDetail.progress || 0}%</span>
              </div>
              <div className="flex justify-between border-b pb-1.5">
                <span className="text-slate-500">รหัสวุฒิบัตร:</span>
                <span className="font-mono font-bold text-slate-700">{selectedStudentDetail.certId || '-'}</span>
              </div>
            </div>

            <button
              onClick={() => setSelectedStudentDetail(null)}
              className="w-full py-2.5 bg-slate-800 text-white text-xs font-bold rounded-xl hover:bg-slate-700 transition cursor-pointer"
            >
              ปิดหน้าต่าง
            </button>
          </div>
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
